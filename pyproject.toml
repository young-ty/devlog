[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devlog"
description = "本地开发复盘工具：扫描 Git 历史并生成可确认的复盘草稿。"
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "uvicorn[standard]==0.52.4",
]

[project.optional-dependencies]
# 只有"打包成 exe"才需要，所以不放进运行时依赖。
package = [
    "pyinstaller==6.22.3",
]

[project.scripts]
devlog = "devlog.cli.main:main"

[tool.setuptools.dynamic]
version = {attr = "devlog.__version__"}

[tool.setuptools.packages.find]
include = ["devlog*"]
